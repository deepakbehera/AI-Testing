name: LLM Evaluation — DeepEval

# ── Triggers ──────────────────────────────────────────────────────────────────
on:
  push:
    branches: [main]
    paths:
      - "module-04-deepeval-llm-testing/ci/**"
      - ".github/workflows/llm-eval.yml"
  pull_request:
    branches: [main]
    paths:
      - "module-04-deepeval-llm-testing/ci/**"
  workflow_dispatch:           # manual "Run workflow" button in Actions tab

# ── Jobs ──────────────────────────────────────────────────────────────────────
# There is no deployed app — this workflow tests the LLM itself. It builds a
# fresh eval dataset from module-04-deepeval-llm-testing/ci/golden_dataset.json
# by calling the model directly, then runs the DeepEval pytest suites against it.
jobs:

  llm-eval:
    name: LLM Evaluation Suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('module-04-deepeval-llm-testing/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r module-04-deepeval-llm-testing/requirements.txt

      # Same Azure deployment for both the model under test and the DeepEval
      # judge (see ci/judge_model.py) — no OpenAI key needed anywhere here.
      - name: Generate golden eval dataset (calls the Azure-deployed LLM directly)
        env:
          PROVIDER: azure
          AZURE_OPENAI_ENDPOINT_C: ${{ secrets.AZURE_OPENAI_ENDPOINT_C }}
          AZURE_OPENAI_KEY: ${{ secrets.AZURE_OPENAI_KEY }}
          AZURE_OPENAI_DEPLOYMENT: ${{ vars.AZURE_OPENAI_DEPLOYMENT || 'Phi-4-mini-instruct' }}
        run: |
          cd module-04-deepeval-llm-testing/ci
          python generate_eval_dataset.py

      - name: Run LLM quality suite (answer relevancy, correctness, faithfulness)
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_MODEL_NAME: ${{ vars.AZURE_MODEL_NAME || 'Phi-4-mini-instruct' }}
          AZURE_DEPLOYMENT_NAME: ${{ vars.AZURE_DEPLOYMENT_NAME || 'Phi-4-mini-instruct' }}
          OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION || '2025-01-01-preview' }}
        run: |
          cd module-04-deepeval-llm-testing/ci
          pytest test_llm_eval.py -v --tb=short \
            --html=eval_report.html --self-contained-html \
            2>&1 | tee eval_output.txt

      - name: Run hard-negative metric-sensitivity suite
        env:
          AZURE_OPENAI_API_KEY: ${{ secrets.AZURE_OPENAI_API_KEY }}
          AZURE_OPENAI_ENDPOINT: ${{ secrets.AZURE_OPENAI_ENDPOINT }}
          AZURE_MODEL_NAME: ${{ vars.AZURE_MODEL_NAME || 'Phi-4-mini-instruct' }}
          AZURE_DEPLOYMENT_NAME: ${{ vars.AZURE_DEPLOYMENT_NAME || 'Phi-4-mini-instruct' }}
          OPENAI_API_VERSION: ${{ vars.OPENAI_API_VERSION || '2025-01-01-preview' }}
        run: |
          cd module-04-deepeval-llm-testing/ci
          pytest test_hard_negatives.py -v --tb=short \
            --html=hard_negative_report.html --self-contained-html \
            2>&1 | tee hard_negative_output.txt

      - name: Write coverage matrix to job summary
        if: always()
        run: |
          cd module-04-deepeval-llm-testing/ci
          echo "## Testing-Mindset Coverage Matrix (capability x failure mode)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          python coverage_matrix.py >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "📄 Download the full HTML reports from the Artifacts section above." >> $GITHUB_STEP_SUMMARY

      - name: Upload eval artifacts
        uses: actions/upload-artifact@v4
        if: always()         # upload even on failure — you need the report to debug
        with:
          name: deepeval-report-${{ github.run_id }}
          path: |
            module-04-deepeval-llm-testing/ci/eval_dataset.json
            module-04-deepeval-llm-testing/ci/eval_report.html
            module-04-deepeval-llm-testing/ci/eval_output.txt
            module-04-deepeval-llm-testing/ci/hard_negative_report.html
            module-04-deepeval-llm-testing/ci/hard_negative_output.txt
          retention-days: 30
