# Day 7 — GitHub Actions workflow for the AI test suite.
#
# Copy this into `.github/workflows/llm-tests.yml` at the repo root.
# Before merging, configure repo secrets at:
#   Settings → Secrets and variables → Actions → New repository secret
# Add:
#   OPENAI_API_KEY      (required if PROVIDER=openai)
#   ANTHROPIC_API_KEY   (required if PROVIDER=anthropic)

name: LLM Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:        # allow manual runs from the Actions tab
  schedule:
    - cron: "0 6 * * 1"     # weekly nightly run, Monday 06:00 UTC

jobs:
  test:
    name: Run pytest suite
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Reasonable defaults — override per repo as needed
    env:
      PROVIDER: openai
      DEMO_MODEL: gpt-4o-mini
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ hashFiles('module-02-python-for-ai-testing/requirements.txt') }}

      - name: Install dependencies
        working-directory: module-02-python-for-ai-testing
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run pytest with HTML report
        working-directory: module-02-python-for-ai-testing/examples/day6_framework
        run: |
          pytest -v \
            --html=report.html \
            --self-contained-html \
            --junitxml=junit.xml

      - name: Upload HTML report
        if: always()     # even on failure — we want to see why
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: module-02-python-for-ai-testing/examples/day6_framework/report.html
          retention-days: 30

      - name: Upload JUnit XML
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-junit-xml
          path: module-02-python-for-ai-testing/examples/day6_framework/junit.xml
          retention-days: 30

      - name: Publish test results in the Actions UI
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: module-02-python-for-ai-testing/examples/day6_framework/junit.xml
